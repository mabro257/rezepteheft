<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rezepte</title>
<meta name="description" content="Persönliche Rezeptsammlung – suchen, filtern, kochen.">
<meta name="theme-color" content="#E8EBE3">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23141A15'/><text x='16' y='23' font-size='19' font-family='Georgia,serif' fill='%23D99A0B' text-anchor='middle'>R</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=7b786e45c6">
</head>
<body>

<a class="skip" href="#grid">Zur Rezeptliste springen</a>

<header class="topbar">
  <button class="icon-btn" id="filterToggle" aria-expanded="false" aria-controls="rail">Filter</button>
  <span class="topbar__brand">Rezepte</span>
  <span class="topbar__spacer"></span>
</header>

<div class="shell">

  <aside class="rail" id="rail" aria-label="Filter">
    <div class="rail__inner">
      <div class="brand">
        <span class="brand__mark">R</span>
        <span class="brand__word">Rezepte</span>
      </div>

      <nav class="facet" aria-labelledby="f-tags">
        <h2 class="facet__title" id="f-tags">Tags</h2>
        <div class="chips" id="tagList"></div>
      </nav>

      <nav class="facet" aria-labelledby="f-health">
        <h2 class="facet__title" id="f-health">Ernährung</h2>
        <div class="chips" id="healthList"></div>
      </nav>


      <div class="facet">
        <h2 class="facet__title" id="f-time">Zeit bis <output class="facet__out" id="timeOut" for="timeRange">–</output></h2>
        <input type="range" id="timeRange" min="5" max="120" step="5" value="120" aria-labelledby="f-time">
      </div>

      <div class="facet facet--row">
        <button class="ghost-btn" id="resetBtn">Filter zurücksetzen</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="masthead">
      <h1 class="masthead__title">Was <em>kochen</em> wir?</h1>
      <div class="search">
        <input type="search" id="search" placeholder="Rezept, Zutat oder Technik suchen" autocomplete="off" aria-label="Rezepte durchsuchen">
        <kbd class="search__kbd">/</kbd>
      </div>
      <div class="quickfilter" id="catList" role="group" aria-label="Kategorie"></div>
    </div>

    <div class="toolbar">
      <p class="toolbar__count" id="count"></p>
      <div class="toolbar__actions">
        <label class="select">
          <span>Sortieren</span>
          <select id="sort">
            <option value="title">A–Z</option>
            <option value="time">Zeit aufsteigend</option>
            <option value="kcal">Kalorien aufsteigend</option>
            <option value="ingredients">Wenigste Zutaten</option>
          </select>
        </label>
        <button class="ghost-btn" id="planToggle" aria-pressed="false">Zusammen kochen</button>
      </div>
    </div>

    <section class="planbar" id="planbar" hidden></section>
    <section class="suggest" id="suggest" hidden></section>

    <section class="grid" id="grid" aria-live="polite"></section>

    <p class="empty" id="empty" hidden>Kein Rezept passt zu dieser Kombination. Suchbegriff kürzen oder einen Filter lösen.</p>
  </main>
</div>

<!-- Rezeptansicht -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></div>



<!-- Von Netlify beim Deploy erkannt. Unsichtbar, die eigentliche Eingabe
     erfolgt in der Rezeptansicht und wird per JavaScript hierher geschickt. -->
<form name="rezept-feedback" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="text" name="rezept">
  <input type="text" name="rezept-id">
  <input type="text" name="art">
  <input type="text" name="von">
  <textarea name="nachricht"></textarea>
  <input type="text" name="bot-field">
</form>

<div class="timers" id="timers" aria-live="polite" hidden></div>

<script src="data/recipes.js?v=227d95d3b4"></script>
<script src="assets/app.js?v=7f4cdafa07"></script>
</body>
</html>
